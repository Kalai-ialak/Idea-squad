<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <!-- Background transparent -->
  
  <!-- IDEA text -->
  <text x="0" y="55" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#1a1a1a" letter-spacing="-2">IDE</text>
  
  <!-- Lightbulb replaces A -->
  <g transform="translate(152, 10)">
    <!-- Bulb outline -->
    <circle cx="18" cy="22" r="16" fill="none" stroke="#CC1144" stroke-width="2.5"/>
    <!-- Brain left -->
    <path d="M10 20 Q12 14 18 16 Q16 20 14 22 Q12 24 10 20Z" fill="#8B0033" opacity="0.8"/>
    <!-- Brain right -->
    <path d="M26 20 Q24 14 18 16 Q20 20 22 22 Q24 24 26 20Z" fill="#CC1144" opacity="0.9"/>
    <!-- Base -->
    <rect x="13" y="36" width="10" height="4" rx="1" fill="#1a1a1a"/>
    <rect x="14" y="40" width="8" height="3" rx="1" fill="#1a1a1a"/>
    <!-- Rays -->
    <line x1="18" y1="4" x2="18" y2="1" stroke="#CC1144" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="8" x2="34" y2="6" stroke="#CC1144" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="8" x2="2" y2="6" stroke="#CC1144" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="22" x2="39" y2="22" stroke="#CC1144" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="22" x2="-3" y2="22" stroke="#CC1144" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- SQUAD text -->
  <text x="0" y="90" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a" letter-spacing="8">SQUAD</text>
  
  <!-- AGENCY text with lines -->
  <line x1="0" y1="98" x2="38" y2="98" stroke="#CC1144" stroke-width="1.5"/>
  <text x="42" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#1a1a1a" letter-spacing="6">AGENCY</text>
  <line x1="138" y1="98" x2="180" y2="98" stroke="#CC1144" stroke-width="1.5"/>
</svg>
